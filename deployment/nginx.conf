# Nginx Server Block Configuration for fancyrsvp.com
# Save this file to /etc/nginx/sites-available/fancy-rsvp
# Create a symlink to enable it:
# sudo ln -s /etc/nginx/sites-available/fancy-rsvp /etc/nginx/sites-enabled/
# Test config: sudo nginx -t
# Reload nginx: sudo systemctl reload nginx

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# The public zone fronts the GUEST surface — the invitation page's own read, the
# analytics beacon and the seating lookups. It is keyed on $binary_remote_addr,
# i.e. the raw TCP peer, and guests overwhelmingly arrive from SHARED addresses:
# mobile-carrier CGNAT pools, one household/office/venue Wi-Fi. A rate sized for
# "one human" therefore throttles whole groups of real guests at once, which
# presents to them as an invitation link that simply doesn't open. Sized for a
# crowd behind one NAT, not for one person.
limit_req_zone $binary_remote_addr zone=public:10m rate=50r/s;

# HTTP → HTTPS redirect (all traffic)
server {
    listen 80;
    listen [::]:80;
    server_name fancyrsvp.com www.fancyrsvp.com;

    server_tokens off;

    # Allow Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Canonical host redirect: www → apex.
#
# WHY THIS EXISTS: www used to be served by the main block below as a co-equal
# origin, with no redirect anywhere in nginx, next.config.mjs or middleware. That
# made the app reachable on two origins at once, which is a problem because the
# apex sends HSTS with `includeSubDomains` — so www is covered by that policy and
# any imperfection there (a certificate reissued without the www SAN, a missing
# DNS record) becomes a NON-BYPASSABLE "secure connection" failure with no
# click-through, for exactly the users whose browser has already seen the apex's
# HSTS header. It also meant a guest on www made CROSS-origin calls to the apex
# API, where sendBeacon (application/json needs a preflight it cannot perform) is
# silently dropped and csrfOriginGuard rejects writes unless www happens to be in
# FRONTEND_URL. One canonical origin removes that entire class of failure.
#
# The certificate must still cover www for this block to terminate TLS at all:
#   sudo certbot --nginx -d fancyrsvp.com -d www.fancyrsvp.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.fancyrsvp.com;

    ssl_certificate /etc/letsencrypt/live/fancyrsvp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fancyrsvp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    server_tokens off;

    return 301 https://fancyrsvp.com$request_uri;
}

# HTTPS server block
server {
    # `listen ... http2` is deprecated as of nginx 1.25.1 (it logs a warning and
    # the parameter is ignored); `http2 on;` is the supported directive.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fancyrsvp.com;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/fancyrsvp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fancyrsvp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Mozilla "Intermediate" suite list. The previous four-suite allowlist was
    # AES-GCM ONLY — no ChaCha20, no CBC fallback — so any TLS 1.2 client without
    # an AES-GCM path (older Android WebViews, devices without AES-NI that prefer
    # ChaCha20, corporate TLS-inspection middleboxes that renegotiate with a
    # narrowed list) got no shared cipher. That surfaces to the user as
    # ERR_SSL_VERSION_OR_CIPHER_MISMATCH — rendered verbatim by Chrome as "This
    # site can't provide a secure connection" and by Safari as "can't establish a
    # secure connection to the server". It is origin-wide, so an affected user
    # cannot open ANY page; it reads as "invitation links are broken" only because
    # an invitation link is the sole URL those users were ever given.
    # Verify client coverage in SSL Labs' Handshake Simulation section, not just
    # the letter grade — a narrow list scores well and still locks people out.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling — the server fetches its own revocation proof instead of
    # leaving each client to reach Let's Encrypt mid-handshake, which removes a
    # third-party dependency from every new connection (and a stall for clients on
    # networks where the OCSP responder is slow or blocked).
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/fancyrsvp.com/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Hide Nginx version
    server_tokens off;

    # Client uploads configuration. Must be >= the Express body limit (50mb, see
    # backend/app.js) or authenticated CSV/image uploads between 20–50 MB are
    # rejected here with a raw nginx 413 before Express ever sees them. Public
    # RSVP writes are separately capped at 64kb inside Express.
    client_max_body_size 50M;

    # Compression (Gzip)
    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    # X-XSS-Protection removed — deprecated in modern browsers and can introduce side-channel attacks
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # Kept in sync with frontend/next.config.mjs (both edge layers emit a CSP; the
    # browser enforces the intersection, so they MUST allow the same sources or a
    # legitimate resource silently breaks). Any change here must be mirrored there.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://maps.googleapis.com https://challenges.cloudflare.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://accounts.google.com https://oauth2.googleapis.com https://maps.googleapis.com https://challenges.cloudflare.com https://fancyrsvp.com; frame-src 'self' https://accounts.google.com https://www.google.com https://maps.googleapis.com https://challenges.cloudflare.com https://www.youtube.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

    # Proxy timeouts
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    # 1. Express Backend API - Auth endpoints (strict rate limit)
    location /api/v1/auth {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Express Backend API - Public endpoints (moderate rate limit)
    location /api/v1/public {
        limit_req zone=public burst=100 nodelay;
        # Default is 503, whose body is an nginx HTML page. The guest clients parse
        # JSON and treat an unparseable body as a generic failure, so a throttle was
        # indistinguishable from "this event doesn't exist". 429 is both correct and
        # the status the client now maps to a retryable state.
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Express Backend API - All other endpoints (standard rate limit)
    location /api {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Next.js Frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Serve Next.js static files directly if cached
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # An `add_header` in a location block REPLACES (does not merge) the
        # server-level headers, so the security headers above are dropped for
        # every static asset unless repeated here. Re-declare the load-bearing
        # ones alongside the long-cache header.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 365d;
        access_log off;
    }
}
