                        // The flap slide/fade animation is driven by the vendor engine
                        // tweening style.transform via requestAnimationFrame (not CSS
                        // transitions), so a prefers-reduced-motion CSS override alone
                        // would have no effect. Instead, for users who've asked for
                        // reduced motion, zero out the duration ('dt') and delay ('ti')
                        // in each element's own animation keyframes before the engine
                        // reads them, so the same engine still runs but resolves the
                        // open animation instantly instead of animating it.
                        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                            document.querySelectorAll('#rec2339662043 [data-animate-sbs-opts]').forEach(function(el) {

                                if (opts) {
                                    opts = opts.replace(/'dt':\d+/g, "'dt':0").replace(/'ti':\d+/g, "'ti':0");
                                    el.setAttribute('data-animate-sbs-opts', opts);

                            <script>
                                function waitForButton(selector, callback) {
                                    const button = document.querySelector(selector);
                                    if (button) {
                                        callback(button);
                                    } else {
                                        setTimeout( () => waitForButton(selector, callback), 100);
                                    }
                                }
                                waitForButton('.popup-enter', function(enterButton) {
                                    enterButton.addEventListener('keydown', function(e) {
                                        if (e.key === 'Enter' || e.key === ' ') {
                                            e.preventDefault();
                                            enterButton.click();
                                        }
                                    });
                                    const audio = document.getElementById('invitation-audio');
                                    const audioControl = document.getElementById('audio-control');
                                    const iconPlay = document.getElementById('icon-play');
                                    const iconPause = document.getElementById('icon-pause');
                                    enterButton.addEventListener('click', function() {
                                        audio.muted = false;
                                        audio.play().then( () => {
                                            iconPlay.style.display = 'none';
                                            iconPause.style.display = 'block';
                                        }
                                        ).catch(err => console.log('Audio play failed:', err));
                                        audioControl.style.visibility = 'visible';
                                        audioControl.style.opacity = '1';
                                    });
                                    function toggleAudio() {
                                        if (audio.paused) {
                                            audio.play();
                                            iconPlay.style.display = 'none';
                                            iconPause.style.display = 'block';
                                        } else {
                                            audio.pause();
                                            iconPlay.style.display = 'block';
                                            iconPause.style.display = 'none';
                                        }
                                    }
                                    audioControl.addEventListener('click', toggleAudio);
                                    audioControl.addEventListener('keydown', function(e) {
                                        if (e.key === 'Enter' || e.key === ' ') {
                                            e.preventDefault();
                                            toggleAudio();
                                        }
                                    });
                                });

                            <script>
