<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#222;font:12px/1.4 'Segoe UI',sans-serif;color:#eee;}
  .row{display:flex;gap:10px;padding:10px;}
  figure{margin:0;}
  figcaption{padding:4px 2px;}
  /* An iframe, not a narrow window: Chrome on Windows will not open a window
     under ~500px, so --window-size=390 gives a 500px LAYOUT cropped to a 390px
     image, which looks exactly like horizontal overflow and is not. */
  iframe{display:block;width:390px;height:844px;border:0;background:#000;}
</style></head><body>
<div class="row">
  <figure><figcaption>open-cover-en</figcaption><iframe src="open-cover-en.html" scrolling="no"></iframe></figure>
  <figure><figcaption>open-cover-ar</figcaption><iframe src="open-cover-ar.html" scrolling="no"></iframe></figure>
  <figure><figcaption>open-revealed-en</figcaption><iframe src="open-revealed-en.html" scrolling="no"></iframe></figure>
  <figure><figcaption>hero-embossed-en</figcaption><iframe src="hero-embossed-en.html" scrolling="no"></iframe></figure>
  <figure><figcaption>hero-bloomed-en</figcaption><iframe src="hero-bloomed-en.html" scrolling="no"></iframe></figure>
  <figure><figcaption>hero-bloomed-ar</figcaption><iframe src="hero-bloomed-ar.html" scrolling="no"></iframe></figure>
</div>
</body></html>
